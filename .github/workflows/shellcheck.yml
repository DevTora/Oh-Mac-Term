name: ShellCheck

on: [push, pull_request]

jobs:
  shellcheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: brew install shellcheck
      - name: Run ShellCheck
        run: shellcheck -S warning key-remap/bin/install.sh key-remap/bin/uninstall.sh key-remap/bin/bootstrap.sh freezeterm/freezeterm.sh
